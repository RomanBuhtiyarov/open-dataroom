# Пример для существующего Nginx. Отдельный поддомен, HTTPS, прокси на loopback-порт web.
# Не логируем query string: в ссылках приглашения есть токен.
log_format dataroom '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 443 ssl http2;
    server_name dataroom.example.com;

    ssl_certificate     /etc/letsencrypt/live/dataroom.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dataroom.example.com/privkey.pem;

    access_log /var/log/nginx/dataroom.access.log dataroom;
    client_max_body_size 55m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # Перезаписываем, а не дополняем: приложение берёт адрес клиента отсюда (ограничение частоты).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_redirect off;
    }
}

server {
    listen 80;
    server_name dataroom.example.com;
    return 301 https://$host$request_uri;
}
