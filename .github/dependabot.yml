version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Проект на Django 5.2 LTS (см. CLAUDE.md): переход на другую ветку делается осознанно, а не автоматически.
      - dependency-name: django
        update-types: ["version-update:semver-major", "version-update:semver-minor"]  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
