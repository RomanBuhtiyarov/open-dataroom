name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests-sqlite:
    name: Tests (SQLite, Python 3.12)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
      - name: Migrations are in sync
        run: DJANGO_DEBUG=1 python manage.py makemigrations --check --dry-run
      - name: Translation catalogues are complete
        run: python scripts/check_messages.py

  tests-postgres:
    name: Tests (PostgreSQL 16)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dataroom
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: dataroom
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dataroom -d dataroom"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://dataroom:ci-only-password@127.0.0.1:5432/dataroom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: PostgreSQL client tools (pg_dump, pg_restore)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          pg_dump --version
      - run: pip install -r requirements-dev.txt
      - name: Tests on PostgreSQL
        run: python -m pytest -q -rs

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check --select E9,F63,F7,F82,F401,F811 apps dataroom scripts tests

  docker:
    name: Docker image and Compose smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test
        run: bash scripts/ci_compose_smoke.sh
