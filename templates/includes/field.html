{% if field.widget_type == "checkbox" %}
<div class="check">
  {{ field }}
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
</div>
{% else %}
<label for="{{ field.id_for_label }}">{{ field.label }}</label>
{{ field }}
{% endif %}
{% if field.help_text %}<p class="help">{{ field.help_text }}</p>{% endif %}
{% for error in field.errors %}<p class="error" role="alert">{{ error }}</p>{% endfor %}
